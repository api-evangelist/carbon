name: Carbon
description: 'Carbon is a digital manufacturing company that builds an integrated 3D printing platform
  combining Digital Light Synthesis (DLS) printing hardware, advanced photopolymer resins, and cloud-connected
  computational design software. Its technology enables production-scale additive manufacturing of end-use
  polymer parts across automotive, medical, dental, consumer goods, and industrial applications, with the
  Design Engine tool for lattice and part design and the Carbon Academy knowledge base for operational
  guidance. Carbon is a frontier-tech portfolio company backed by GV. As of this profile Carbon exposes
  no public developer API, OpenAPI specification, SDK, or event surface; enrichment is limited to verified
  company identity and domain-security posture.'
